services:
  redis:
    image: redis:7-alpine
    # Tracked cities (tracked:cities) are user intent, not cache, so they have to
    # outlive the container. Without a volume, `docker compose down` would silently
    # drop every city added through the UI. Cached weather also survives, which is
    # harmless: those keys carry their TTLs into the AOF.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Trace collector and UI in one container. No volume: traces are for looking at
  # a run that just happened, and keeping them past `down` would only mean
  # deciding how long to keep them.
  jaeger:
    # quay.io rather than Docker Hub: same image, published by the Jaeger project
    # itself, and Hub's CDN serves this one's blobs unreliably from here.
    image: quay.io/jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP, for a locally-run app pointing at the host

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: weather-cache-service
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
