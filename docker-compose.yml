services:
  redis:
    image: redis:7-alpine
    # Tracked cities (tracked:cities) are user intent, not cache, so they have to
    # outlive the container. Without a volume, `docker compose down` would silently
    # drop every city added through the UI. Cached weather also survives, which is
    # harmless: those keys carry their TTLs into the AOF.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
