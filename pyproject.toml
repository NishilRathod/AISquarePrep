[project]
name = "weather-cache-service"
version = "0.1.0"
description = "FastAPI service that fetches OpenWeather data, reshapes it, and serves it through a Redis cache with outbound rate limiting and pagination."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.1",
    "anthropic>=0.69",
    # Tracing. Inert unless OTEL_EXPORTER_OTLP_ENDPOINT is set (see app/telemetry.py),
    # so these are always installed but cost nothing when nobody is collecting.
    # The HTTP exporter rather than gRPC: no grpcio wheel to build, and Jaeger
    # takes OTLP/HTTP on 4318 either way.
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.26",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
